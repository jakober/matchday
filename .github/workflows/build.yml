name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Sicherheitsnetz: Commits von Windows aus verlieren gelegentlich das
      # Ausfuehrbar-Bit, und dann scheitert der Build mit "Permission denied".
      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: Tests laufen lassen
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      # Ein Aussetzer bei GitHubs Artefaktdienst soll den Build nicht rot
      # faerben - gebaut und geprueft ist zu diesem Zeitpunkt bereits alles.
      - name: APK als Artefakt hochladen
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: matchday-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator)
    # Laeuft wieder bei jedem Push: Oeffentliche Repositories haben
    # unbegrenzte Actions-Minuten, auch auf macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        # Das Gradle-Projekt enthaelt ein Android-Target; ohne SDK schlaegt schon
        # die Konfigurationsphase fehl, auch wenn nur iOS gebaut wird.
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Der Xcode-Build ruft in einer Skriptphase ebenfalls ./gradlew auf.
      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: iosApp
        run: xcodegen generate

      # Ein konkretes Geraet statt "generic": nur so laesst sich die App
      # danach auch starten.
      - name: Simulator auswaehlen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d.get('isAvailable') and 'iPhone' in d['name']:
                          print(d['udid']); raise SystemExit
          ")
          if [ -z "$UDID" ]; then echo "Kein iPhone-Simulator gefunden"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      # Bewusst Release: Das ist die Fassung, die zu TestFlight geht. Ein
      # Debug-Build kann laufen, waehrend Release abstuerzt - Optimierungen
      # und Fehlerbehandlung unterscheiden sich.
      - name: Fuer den Simulator bauen
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Der eigentliche Test: startet die App ueberhaupt?
      - name: Im Simulator starten und ansehen
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=build/DerivedData/Build/Products/Release-iphonesimulator/iosApp.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.jakober.matchday

          # Zeit fuer Start und den ersten Abruf der Spielplaene.
          sleep 25
          mkdir -p artefakte
          xcrun simctl io "$UDID" screenshot artefakte/01-start.png

          # Absturzberichte auswerten - ein leerer Screenshot allein wuerde
          # nicht verraten, warum.
          # Absturzberichte liegen je nach System an zwei Orten.
          for d in ~/Library/Logs/DiagnosticReports "$HOME/Library/Logs/CoreSimulator"; do
            find "$d" -name "*iosApp*" -newermt '-10 minutes' 2>/dev/null | head -5
          done
          CRASHES=$(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i "iosApp" || true)
          if [ -n "$CRASHES" ]; then
            echo "::error::Die App ist abgestuerzt:"
            for f in $CRASHES; do
              cp ~/Library/Logs/DiagnosticReports/"$f" artefakte/ || true
              head -60 ~/Library/Logs/DiagnosticReports/"$f"
            done
            exit 1
          fi
          echo "App laeuft."

      - name: Screenshots hochladen
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: matchday-ios-screenshots
          path: artefakte/
          if-no-files-found: warn

      - name: App-Bundle als Artefakt hochladen
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: matchday-ios-simulator
          path: build/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
