name: TestFlight

# Bewusst nur von Hand ausloesbar. Ein Upload bei jedem Commit waere schaedlich:
# TestFlight-Builds sind 90 Tage gueltig, jeder neue benachrichtigt die Tester,
# und die Buildnummer laesst sich nicht wiederverwenden.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, die den Testern angezeigt wird (z.B. 0.6)'
        required: true
        default: '0.6'

jobs:
  upload:
    name: Bauen und zu TestFlight hochladen
    runs-on: macos-15

    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_VERSION: ${{ inputs.version }}
      # Muss bei jedem Upload steigen; die Laufnummer der Aktion waechst
      # verlaesslich und wird nie wiederverwendet.
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Secrets pruefen
        run: |
          missing=""
          [ -z "$APPSTORE_KEY_ID" ] && missing="$missing APPSTORE_KEY_ID"
          [ -z "$APPSTORE_ISSUER_ID" ] && missing="$missing APPSTORE_ISSUER_ID"
          [ -z "$APPSTORE_PRIVATE_KEY" ] && missing="$missing APPSTORE_PRIVATE_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Repository-Secrets:$missing"
            exit 1
          fi
          echo "Alle Secrets vorhanden."

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: iosApp
        run: xcodegen generate

      - name: Ruby und Fastlane einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Signieren, bauen und hochladen
        run: bundle exec fastlane beta

      - name: IPA als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-ios-${{ inputs.version }}-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: warn
