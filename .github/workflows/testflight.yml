name: TestFlight

# Laeuft von Hand und monatlich nach Zeitplan - aber nicht bei jedem Commit.
# Das waere schaedlich: Jeder neue Build benachrichtigt alle Tester, und die
# Buildnummer laesst sich nie wiederverwenden.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (leer = aus project.yml)'
        required: false
  # Alle zwei Monate ein frischer Build. Grund: TestFlight-Builds laufen 90
  # Tage nach dem Upload ab und lassen sich danach nicht mehr starten. Zwei
  # Monate lassen rund vier Wochen Puffer.
  schedule:
    - cron: '0 4 1 1,3,5,7,9,11 *'

jobs:
  upload:
    name: Bauen und zu TestFlight hochladen
    # Apple nimmt nur noch Pakete an, die mit dem iOS-26-SDK gebaut wurden.
    runs-on: macos-26

    # match legt Zertifikat und Profil im Zweig "certificates" desselben Repos
    # ab - dafuer braucht der Lauf Schreibrecht.
    permissions:
      contents: write

    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Muss bei jedem Upload steigen; die Laufnummer der Aktion waechst
      # verlaesslich und wird nie wiederverwendet.
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Der eingebaute Token reicht: Es ist dasselbe Repo, ein zusaetzlicher
      # Zugriffsschluessel waere unnoetiges Risiko.
      MATCH_GIT_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    steps:
      - uses: actions/checkout@v4

      # Bei einem Lauf nach Zeitplan gibt es keine Eingabe - dann gilt die
      # Version aus project.yml. So gibt es nur eine Quelle der Wahrheit.
      - name: Version bestimmen
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'MARKETING_VERSION:' iosApp/project.yml | tr -d ' "' | cut -d: -f2)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Keine Versionsnummer gefunden"; exit 1
          fi
          echo "Version: $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Secrets pruefen
        run: |
          missing=""
          [ -z "$APPSTORE_KEY_ID" ] && missing="$missing APPSTORE_KEY_ID"
          [ -z "$APPSTORE_ISSUER_ID" ] && missing="$missing APPSTORE_ISSUER_ID"
          [ -z "$APPSTORE_PRIVATE_KEY" ] && missing="$missing APPSTORE_PRIVATE_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$MATCH_PASSWORD" ] && missing="$missing MATCH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Repository-Secrets:$missing"
            exit 1
          fi
          echo "Alle Secrets vorhanden."

      - name: Neuestes Xcode waehlen
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Verwende $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: iosApp
        run: xcodegen generate

      - name: Ruby und Fastlane einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # match legt einen Commit im Zertifikatszweig an und braucht dafuer eine
      # Absenderkennung.
      - name: Git-Kennung fuer match setzen
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Signieren, bauen und hochladen
        run: bundle exec fastlane beta

      # GitHub schaltet geplante Ablaeufe nach 60 Tagen ohne Aktivitaet im
      # Repository ab - also genau dann, wenn die App laenger unangetastet
      # liegt und der Nachschub am noetigsten waere. Dieser Vermerk haelt das
      # Repository nachweislich in Bewegung und dokumentiert nebenbei, wann
      # zuletzt automatisch gebaut wurde.
      - name: Bauvermerk zurueckschreiben
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          mkdir -p .github
          {
            echo "Letzter automatischer TestFlight-Build"
            echo "Version:  $APP_VERSION"
            echo "Build:    ${{ github.run_number }}"
            echo "Zeit:     $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > .github/letzter-testflight-build.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .github/letzter-testflight-build.txt
          # [skip ci] verhindert einen ueberfluessigen Build-Lauf; als
          # Aktivitaet im Repository zaehlt der Push trotzdem.
          git commit -m "Automatischer TestFlight-Build ${{ github.run_number }} [skip ci]" || exit 0
          git push

      - name: IPA als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-ios-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: warn
