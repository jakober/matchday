name: TestFlight

# Bewusst nur von Hand ausloesbar. Ein Upload bei jedem Commit waere schaedlich:
# TestFlight-Builds sind 90 Tage gueltig, jeder neue benachrichtigt die Tester,
# und die Buildnummer laesst sich nicht wiederverwenden.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, die den Testern angezeigt wird (z.B. 0.6)'
        required: true
        default: '0.6'

jobs:
  upload:
    name: Bauen und zu TestFlight hochladen
    # Apple nimmt nur noch Pakete an, die mit dem iOS-26-SDK gebaut wurden.
    runs-on: macos-26

    # match legt Zertifikat und Profil im Zweig "certificates" desselben Repos
    # ab - dafuer braucht der Lauf Schreibrecht.
    permissions:
      contents: write

    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_VERSION: ${{ inputs.version }}
      # Muss bei jedem Upload steigen; die Laufnummer der Aktion waechst
      # verlaesslich und wird nie wiederverwendet.
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Der eingebaute Token reicht: Es ist dasselbe Repo, ein zusaetzlicher
      # Zugriffsschluessel waere unnoetiges Risiko.
      MATCH_GIT_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    steps:
      - uses: actions/checkout@v4

      - name: Secrets pruefen
        run: |
          missing=""
          [ -z "$APPSTORE_KEY_ID" ] && missing="$missing APPSTORE_KEY_ID"
          [ -z "$APPSTORE_ISSUER_ID" ] && missing="$missing APPSTORE_ISSUER_ID"
          [ -z "$APPSTORE_PRIVATE_KEY" ] && missing="$missing APPSTORE_PRIVATE_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$MATCH_PASSWORD" ] && missing="$missing MATCH_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Repository-Secrets:$missing"
            exit 1
          fi
          echo "Alle Secrets vorhanden."

      - name: Neuestes Xcode waehlen
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Verwende $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x gradlew

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: iosApp
        run: xcodegen generate

      - name: Ruby und Fastlane einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # match legt einen Commit im Zertifikatszweig an und braucht dafuer eine
      # Absenderkennung.
      - name: Git-Kennung fuer match setzen
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Signieren, bauen und hochladen
        run: bundle exec fastlane beta

      - name: IPA als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-ios-${{ inputs.version }}-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: warn
