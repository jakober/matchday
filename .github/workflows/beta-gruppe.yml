name: Testgruppen ansehen

# Zeigt, welche Testgruppen es gibt und wer darin steht - intern wie extern.
#
# Die Weboberflaeche von App Store Connect hat sich hier schon einmal
# unzuverlaessig gezeigt (der Abschnitt "Externe Tests" fehlte komplett).
# Die Schnittstelle antwortet verlaesslich.

on:
  workflow_dispatch:

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - name: Python vorbereiten
        run: pip install --quiet pyjwt cryptography requests

      - name: Gruppen und Tester auflisten
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, time, jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              os.environ["PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["KEY_ID"], "typ": "JWT"},
          )
          head = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"

          apps = requests.get(f"{base}/apps", headers=head,
                              params={"filter[bundleId]": "com.jakober.matchday"}).json()
          app_id = apps["data"][0]["id"]

          gruppen = requests.get(
              f"{base}/betaGroups", headers=head,
              params={"filter[app]": app_id,
                      "fields[betaGroups]": "name,isInternalGroup,publicLinkEnabled"},
          ).json()

          print("=== Testgruppen ===")
          for g in gruppen.get("data", []):
              art = "INTERN" if g["attributes"]["isInternalGroup"] else "EXTERN"
              tester = requests.get(
                  f"{base}/betaGroups/{g['id']}/betaTesters", headers=head,
                  params={"fields[betaTesters]": "email,firstName,lastName,state"},
              ).json()
              eintraege = tester.get("data", [])
              print(f"{art:7} {g['attributes']['name']:22} {len(eintraege)} Tester")
              for t in eintraege:
                  a = t["attributes"]
                  print(f"        {a.get('email')}  Zustand: {a.get('state')}")

          builds = requests.get(
              f"{base}/builds", headers=head,
              params={"filter[app]": app_id, "limit": 5,
                      "fields[builds]": "version,processingState,expired",
                      "sort": "-version"},
          ).json()
          print("\n=== Letzte Builds ===")
          for b in builds.get("data", []):
              a = b["attributes"]
              print(f"  Build {a.get('version')}  {a.get('processingState')}"
                    f"  abgelaufen: {a.get('expired')}")
          PY
