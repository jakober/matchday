name: Testgruppen ansehen

# Zeigt, welche Testgruppen es gibt und wer darin steht - intern wie extern.
#
# Die Weboberflaeche von App Store Connect hat sich hier schon einmal
# unzuverlaessig gezeigt (der Abschnitt "Externe Tests" fehlte komplett).
# Die Schnittstelle antwortet verlaesslich.

on:
  workflow_dispatch:

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - name: Python vorbereiten
        run: pip install --quiet pyjwt cryptography requests

      - name: Gruppen und Tester auflisten
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os, time, jwt, requests

          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              os.environ["PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["KEY_ID"], "typ": "JWT"},
          )
          head = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"

          apps = requests.get(f"{base}/apps", headers=head,
                              params={"filter[bundleId]": "com.jakober.matchday"}).json()
          app_id = apps["data"][0]["id"]

          # Ueber die Beziehung der App, nicht ueber filter[app]: Der Filter
          # lieferte eine leere Liste, obwohl die Weboberflaeche Gruppen zeigt.
          gruppen = requests.get(
              f"{base}/apps/{app_id}/betaGroups", headers=head,
          ).json()

          print("=== Testgruppen ===")
          if "errors" in gruppen:
              print(gruppen["errors"])
          for g in gruppen.get("data", []):
              a = g["attributes"]
              art = "INTERN" if a.get("isInternalGroup") else "EXTERN"
              auto = "automatisch" if a.get("hasAccessToAllBuilds") else "manuell"
              print(f"{art:7} {a.get('name'):22} Verteilung: {auto}")
              tester = requests.get(
                  f"{base}/betaGroups/{g['id']}/betaTesters", headers=head,
                  params={"fields[betaTesters]": "email,firstName,lastName,state"},
              ).json()
              for t in tester.get("data", []):
                  ta = t["attributes"]
                  print(f"        {ta.get('email')}  Zustand: {ta.get('state')}")
              if not tester.get("data"):
                  print("        (keine Tester)")

          # Wer ueberhaupt Zugriff auf das Konto hat - nur diese Personen
          # koennen interne Tester werden.
          nutzer = requests.get(f"{base}/users", headers=head).json()
          print("\n=== Konto-Benutzer ===")
          for u in nutzer.get("data", []):
              a = u["attributes"]
              print(f"  {a.get('username')}  Rollen: {','.join(a.get('roles') or [])}")

          # Offene Einladungen: Wer die Mail von Apple nie angenommen hat, ist
          # noch kein Benutzer - und damit auch kein interner Tester, egal was
          # die Gruppe in der Weboberflaeche anzeigt.
          offen = requests.get(f"{base}/userInvitations", headers=head).json()
          print("
=== Offene Benutzer-Einladungen ===")
          for u in offen.get("data", []):
              a = u["attributes"]
              print(f"  {a.get('email')}  Rollen: {','.join(a.get('roles') or [])}  laeuft ab: {a.get('expirationDate')}")
          if not offen.get("data"):
              print("  (keine)")

          builds = requests.get(
              f"{base}/builds", headers=head,
              params={"filter[app]": app_id, "limit": 5,
                      "fields[builds]": "version,processingState,expired",
                      "sort": "-version"},
          ).json()
          print("\n=== Letzte Builds ===")
          for b in builds.get("data", []):
              a = b["attributes"]
              print(f"  Build {a.get('version')}  {a.get('processingState')}"
                    f"  abgelaufen: {a.get('expired')}")
          PY
