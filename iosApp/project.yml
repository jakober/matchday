# Xcode-Projekt wird aus dieser Datei erzeugt (xcodegen generate).
# Damit muss keine .xcodeproj im Repo liegen - die ist binaer und erzeugt bei
# jedem Merge Konflikte.
name: iosApp

options:
  bundleIdPrefix: com.jakober
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Matchday
        # Aus den Build-Einstellungen gespeist, damit die CI die Buildnummer
        # setzen kann - TestFlight lehnt eine bereits hochgeladene ab.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Die App nutzt nur HTTPS. Ohne diesen Eintrag fragt App Store Connect
        # bei jedem Build nach der Exportregelung fuer Verschluesselung und
        # haelt den Build so lange zurueck.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        # Ohne diese beiden Eintraege lehnt iOS die Hintergrundaufgabe ab.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.jakober.matchday.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakober.matchday
        MARKETING_VERSION: "0.6"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
        CODE_SIGN_STYLE: Automatic
      configs:
        # Ohne diese Angabe versucht Xcode beim Archivieren ein
        # Entwicklerprofil zu erzeugen. Das ist an registrierte Geraete
        # gebunden - fuer TestFlight braucht es ein Verteilungsprofil.
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    preBuildScripts:
      - name: Kotlin-Framework bauen
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
