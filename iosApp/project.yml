# Xcode-Projekt wird aus dieser Datei erzeugt (xcodegen generate).
# Damit muss keine .xcodeproj im Repo liegen - die ist binaer und erzeugt bei
# jedem Merge Konflikte.
name: iosApp

options:
  bundleIdPrefix: com.jakober
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Matchday
        # Aus den Build-Einstellungen gespeist, damit die CI die Buildnummer
        # setzen kann - TestFlight lehnt eine bereits hochgeladene ab.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Einladungslink aus der Mail: matchday://invite?code=ABC123
        CFBundleURLTypes:
          - CFBundleURLName: com.jakober.matchday
            CFBundleURLSchemes:
              - matchday
        # Ohne diesen Eintrag bricht Compose Multiplatform beim Start ab -
        # geprueft wird das nur im Release-Build. iOS zeichnet sonst auf
        # ProMotion-Geraeten nur mit 60 statt 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # Die App nutzt nur HTTPS. Ohne diesen Eintrag fragt App Store Connect
        # bei jedem Build nach der Exportregelung fuer Verschluesselung und
        # haelt den Build so lange zurueck.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        # Ohne diese beiden Eintraege lehnt iOS die Hintergrundaufgabe ab.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.jakober.matchday.refresh
        # Alle vier: Wer das iPad unterstuetzt, muss auch Hochformat kopfueber
        # anbieten, sonst weist App Store Connect das Paket zurueck.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakober.matchday
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # Massgebliche Versionsnummer. Der TestFlight-Ablauf liest sie hier,
        # wenn beim Auslösen keine angegeben wird - also bei jedem Lauf nach
        # Zeitplan. Bei neuen Funktionen hier hochzaehlen.
        MARKETING_VERSION: "0.37"
        CURRENT_PROJECT_VERSION: "1"
        # Nur iPhone: Fuer den Store entfallen damit iPad-Screenshots und
        # die Pruefung auf dem iPad. Die App ist fuers Handy gedacht.
        TARGETED_DEVICE_FAMILY: "1"
        # Setzt zugleich CFBundleIconName im Paket - ohne den Eintrag lehnt
        # App Store Connect den Upload ab.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
        # Signatur wird beim Bauen gesetzt: Simulator-Builds ohne, der
        # Verteilungsbuild manuell mit dem Profil, das Fastlane besorgt.
        # Automatische Signierung scheidet aus - sie verlangt ein
        # Entwicklerprofil und damit ein registriertes Geraet.
    preBuildScripts:
      - name: Kotlin-Framework bauen
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
